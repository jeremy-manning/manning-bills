# Publishes dist_static/ to GitHub Pages on every push to main.
#
# Deploying via Actions rather than "deploy from a branch" because the branch
# option can only serve the repo root or /docs, and the site is built into
# dist_static/. This keeps the build output where build_static.py puts it.
#
# Nothing here needs secrets: the published page contains no credentials, and
# the Supabase publishable key in supabase-config.js is meant to be public.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    # Nothing is published unless the suite passes. The tests need no
    # dependencies, so there is no install step to go stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the test suite
        working-directory: source
        run: node run_tests.js

      - name: Confirm the committed page matches the source
        run: |
          # A hand-edited or stale dist_static/index.html would ship something
          # nobody reviewed. Rebuild and diff.
          cp dist_static/index.html /tmp/committed.html
          cd source && python3 build_static.py
          if ! diff -q /tmp/committed.html ../dist_static/index.html >/dev/null; then
            echo "::error::dist_static/index.html is not what source/ builds. Run: cd source && python3 build_static.py"
            exit 1
          fi
          echo "Committed page matches the source."

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist_static
      - id: deployment
        uses: actions/deploy-pages@v4
